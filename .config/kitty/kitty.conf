# vim:ft=kitty

allow_remote_control socket-only
listen_on unix:/tmp/kitty-{kitty_pid}

# Default opacity; theme-toggle.sh overrides per mode via mode.conf below
# (opaque in light mode, where 0.85 translucency muddies text/highlights).
background_opacity 0.85
background_blur 64
dynamic_background_opacity yes

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# FONTS
# Defaults; theme-toggle.sh overrides font_family per mode via mode.conf below
# (heavier weight in light mode, where dark-on-light reads thinner).
font_family JetBrainsMono Nerd Font
font_size 11.0

# SCROLLBACK / HISTORY / ROWS
scrollback_lines 10000
scrollback_pager nvim -c "set nomodified" -

# TAB BAR
tab_bar_style powerline
tab_powerline_style slanted

# SHELL INTEGRATION
shell_integration enabled

# Disable transparency in Telescope/StardustXR session
include-if XDG_CURRENT_DESKTOP==Telescope telescope.conf

# Dynamic colors generated by matugen (must be last to override defaults)
include colors-dynamic.conf

# Per-mode font/opacity overrides generated by theme-toggle.sh. Missing on a
# fresh machine until the first theme toggle; kitty just warns and uses the
# defaults above. Included last so it wins.
include mode.conf
