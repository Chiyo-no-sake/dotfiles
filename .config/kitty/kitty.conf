# vim:ft=kitty

allow_remote_control socket-only
listen_on unix:/tmp/kitty-{kitty_pid}

background_opacity 0.85
background_blur 64
dynamic_background_opacity yes

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# FONTS
font_family JetBrainsMono Nerd Font
font_size 11.0

# SCROLLBACK / HISTORY / ROWS
scrollback_lines 10000
scrollback_pager nvim -c "set nomodified" -

# TAB BAR
tab_bar_style powerline
tab_powerline_style slanted

# SHELL INTEGRATION
shell_integration enabled

# Disable transparency in Telescope/StardustXR session
include-if XDG_CURRENT_DESKTOP==Telescope telescope.conf

# Dynamic colors generated by matugen (must be last to override defaults)
include colors-dynamic.conf
