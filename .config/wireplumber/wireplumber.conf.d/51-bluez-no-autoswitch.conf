# Don't downgrade Bluetooth headsets to mono HSP/HFP (mSBC/CVSD) the moment
# an app opens their mic. Classic Bluetooth can't run A2DP (stereo output)
# and HFP (mic) at the same time, so this policy exists to auto-enable the
# mic for headset use cases -- but it tanks output quality for anyone who
# only wants the headset as output and uses a different input device.
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}
