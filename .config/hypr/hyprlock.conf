source = $HOME/.config/hypr/colors.conf

$font = JetBrainsMono Nerd Font

# AUTH settings
auth {
  fingerprint:enabled = true
}

# Machine-local overrides (gitignored)
source = $HOME/.config/hypr/hyprlock-local.conf

# GENERAL
general {
  disable_loading_bar = true
  hide_cursor = true
}

# BACKGROUND
background {
  monitor =
  path = $HOME/.config/background
  blur_passes = 0
  color = $background
}

# LAYOUT
label {
  monitor =
  text = Layout: $LAYOUT
  color = $on_surface
  font_size = 25
  font_family = $font
  position = 30, -30
  halign = left
  valign = top
}

# TIME
label {
  monitor =
  text = $TIME
  color = $on_surface
  font_size = 90
  font_family = $font
  position = -30, 0
  halign = right
  valign = top
}

# DATE
label {
  monitor =
  text = cmd[update:43200000] date +"%A, %d %B %Y"
  color = $on_surface_variant
  font_size = 25
  font_family = $font
  position = -30, -150
  halign = right
  valign = top
}

# USER AVATAR
image {
  monitor =
  path = $HOME/.face
  size = 100
  border_color = $primary
  position = 0, 75
  halign = center
  valign = center
}

# INPUT FIELD
input-field {
  monitor =
  size = 300, 60
  outline_thickness = 4
  dots_size = 0.2
  dots_spacing = 0.2
  dots_center = true
  outer_color = $primary
  inner_color = $surface_variant
  font_color = $on_surface
  fade_on_empty = false
  placeholder_text = <span foreground="##$on_surfaceAlpha"><i>󰌾 Logged in as </i><span foreground="##$primaryAlpha">$USER</span></span>
  hide_input = false
  check_color = $tertiary
  fail_color = $error
  fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
  capslock_color = $secondary
  position = 0, -47
  halign = center
  valign = center
}
