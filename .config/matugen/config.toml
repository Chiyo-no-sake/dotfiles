[config]
fallback_color = "#8aadf4"
prefer = "largest-area"
scheme_type = "scheme-vibrant"

[config.wallpaper]
set = false  # We handle wallpaper ourselves via swww
command = "swww img {{ image }}"

[templates.hyprland]
input_path = "~/.config/matugen/templates/hyprland.conf"
output_path = "~/.config/hypr/colors.conf"

[templates.waybar]
input_path = "~/.config/matugen/templates/waybar.css"
output_path = "~/.config/waybar/colors.css"

[templates.kitty]
input_path = "~/.config/matugen/templates/kitty.conf"
output_path = "~/.config/kitty/colors-dynamic.conf"

[templates.rofi]
input_path = "~/.config/matugen/templates/rofi.rasi"
output_path = "~/.config/rofi/colors/colors.rasi"

[templates.fuzzel]
input_path = "~/.config/matugen/templates/fuzzel.ini"
output_path = "~/.config/fuzzel/colors.ini"

[templates.lazygit]
input_path = "~/.config/matugen/templates/lazygit.yml"
output_path = "~/.config/lazygit/config.yml"

[templates.swaync]
input_path = "~/.config/matugen/templates/swaync.css"
output_path = "~/.config/swaync/colors.css"

[templates.gtk4]
input_path = "~/.config/matugen/templates/gtk4-colors.css"
output_path = "~/.config/gtk-4.0/colors.css"

[templates.gtk3]
input_path = "~/.config/matugen/templates/gtk3-colors.css"
output_path = "~/.config/gtk-3.0/colors.css"

[templates.kdeglobals]
input_path = "~/.config/matugen/templates/kdeglobals"
output_path = "~/.config/matugen/generated/kdeglobals"
post_hook = "~/dotfiles/scripts/runtime/merge-kdeglobals.sh ~/.config/matugen/generated/kdeglobals"

[templates.kde-colorscheme]
input_path = "~/.config/matugen/templates/kdeglobals"
output_path = "~/.local/share/color-schemes/Nothing.colors"

[templates.kvantum]
input_path = "~/.config/matugen/templates/kvantum-colors.kvconfig"
output_path = "~/.config/Kvantum/matugen/matugen.kvconfig"

[templates.qt6ct]
input_path = "~/.config/matugen/templates/qt6ct-colors.conf"
output_path = "~/.config/qt6ct/colors/matugen.conf"

[templates.chrome]
input_path = "~/.config/matugen/templates/chrome-colors.json"
output_path = "~/.config/chrome-theme-colors/colors.json"
post_hook = "~/dotfiles/scripts/runtime/chrome-theme-gen.sh"

[templates.cavalier]
input_path = "~/.config/matugen/templates/cavalier.json"
output_path = "~/.var/app/org.nickvision.cavalier/config/Nickvision Cavalier/config.json"
