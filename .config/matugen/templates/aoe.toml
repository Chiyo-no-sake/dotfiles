# aoe (Agent of Empires) theme, generated by matugen — do not edit.
# Accent-family keys (title/search/accent/help_key/terminal_*/branch/unread)
# get a saturation boost in scripts/runtime/aoe-theme-reload.sh (matugen's
# tone-80 accents are pastel by design).
# Status colors stay semantic: running/add = green, error/delete = matugen
# error, waiting/idle tint = wallpaper tertiary for the warm tones.
background = "{{colors.background.default.hex}}"
border = "{{colors.outline.default.hex}}"
terminal_border = "{{colors.primary.default.hex}}"
selection = "{{colors.surface_variant.default.hex}}"
session_selection = "{{colors.surface_bright.default.hex}}"
title = "{{colors.primary.default.hex}}"
text = "{{colors.on_background.default.hex}}"
dimmed = "{{colors.on_surface_variant.default.hex}}"
hint = "{{colors.outline.default.hex}}"
running = "#4ed17e"
waiting = "{{colors.tertiary.default.hex}}"
fresh_idle = "{{colors.tertiary.default.hex}}"
idle = "{{colors.outline.default.hex}}"
unread = "{{colors.primary.default.hex}}"
error = "{{colors.error.default.hex}}"
terminal_active = "{{colors.primary.default.hex}}"
group = "{{colors.on_background.default.hex}}"
search = "{{colors.primary.default.hex}}"
accent = "{{colors.primary.default.hex}}"
diff_add = "#4ed17e"
diff_delete = "{{colors.error.default.hex}}"
diff_modified = "{{colors.tertiary.default.hex}}"
diff_header = "{{colors.secondary.default.hex}}"
help_key = "{{colors.primary.default.hex}}"
branch = "{{colors.secondary.default.hex}}"
sandbox = "{{colors.on_surface_variant.default.hex}}"
appearance = "dark"

[syntax]
shiki_theme = "github-dark"
