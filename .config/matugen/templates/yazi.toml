# Matugen-generated yazi theme — Material You dynamic colors

[app]
overall = { bg = "{{colors.background.default.hex}}" }

[mgr]
cwd = { fg = "{{colors.primary.default.hex}}" }
find_keyword = { fg = "{{colors.tertiary.default.hex}}", bold = true }
find_position = { fg = "{{colors.secondary.default.hex}}", italic = true }
symlink_target = { fg = "{{colors.on_surface_variant.default.hex}}", italic = true }

marker_copied = { fg = "{{colors.tertiary.default.hex}}", bg = "{{colors.tertiary.default.hex}}" }
marker_cut = { fg = "{{colors.error.default.hex}}", bg = "{{colors.error.default.hex}}" }
marker_marked = { fg = "{{colors.secondary.default.hex}}", bg = "{{colors.secondary.default.hex}}" }
marker_selected = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }

count_copied = { fg = "{{colors.on_tertiary_container.default.hex}}", bg = "{{colors.tertiary_container.default.hex}}" }
count_cut = { fg = "{{colors.on_error_container.default.hex}}", bg = "{{colors.error_container.default.hex}}" }
count_selected = { fg = "{{colors.on_primary_container.default.hex}}", bg = "{{colors.primary_container.default.hex}}" }

border_symbol = "│"
border_style = { fg = "{{colors.outline_variant.default.hex}}" }

[mode]
normal_main = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
normal_alt = { fg = "{{colors.on_surface.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }
select_main = { fg = "{{colors.on_secondary.default.hex}}", bg = "{{colors.secondary.default.hex}}", bold = true }
select_alt = { fg = "{{colors.on_surface.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }
unset_main = { fg = "{{colors.on_error.default.hex}}", bg = "{{colors.error.default.hex}}", bold = true }
unset_alt = { fg = "{{colors.on_surface.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }

[status]
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
overall = { fg = "{{colors.on_surface.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }

perm_type = { fg = "{{colors.primary.default.hex}}" }
perm_read = { fg = "{{colors.tertiary.default.hex}}" }
perm_write = { fg = "{{colors.error.default.hex}}" }
perm_exec = { fg = "{{colors.secondary.default.hex}}" }
perm_sep = { fg = "{{colors.outline_variant.default.hex}}" }

[input]
border = { fg = "{{colors.primary.default.hex}}" }
title = { fg = "{{colors.primary.default.hex}}" }
value = { fg = "{{colors.on_surface.default.hex}}" }
selected = { reversed = true }

[completion]
border = { fg = "{{colors.outline.default.hex}}" }
active = { fg = "{{colors.on_primary_container.default.hex}}", bg = "{{colors.primary_container.default.hex}}" }
inactive = { fg = "{{colors.on_surface.default.hex}}" }

[tasks]
border = { fg = "{{colors.outline.default.hex}}" }
title = { fg = "{{colors.primary.default.hex}}" }
hovered = { fg = "{{colors.on_primary_container.default.hex}}", bg = "{{colors.primary_container.default.hex}}" }

[which]
mask = { bg = "{{colors.surface.default.hex}}" }
cand = { fg = "{{colors.tertiary.default.hex}}" }
rest = { fg = "{{colors.on_surface_variant.default.hex}}" }
desc = { fg = "{{colors.secondary.default.hex}}" }
sep = "  "
sep_style = { fg = "{{colors.outline_variant.default.hex}}" }

[confirm]
border = { fg = "{{colors.primary.default.hex}}" }
title = { fg = "{{colors.primary.default.hex}}" }
content = { fg = "{{colors.on_surface.default.hex}}" }
list = { fg = "{{colors.on_surface.default.hex}}" }
btn_yes = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }
btn_no = { fg = "{{colors.on_surface.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }
btn_label = { bold = true }

[spot]
border = { fg = "{{colors.outline.default.hex}}" }
title = { fg = "{{colors.primary.default.hex}}" }

[notify]
title_info = { fg = "{{colors.primary.default.hex}}" }
title_warn = { fg = "{{colors.tertiary.default.hex}}" }
title_error = { fg = "{{colors.error.default.hex}}" }

[filetype]
rules = [
  { mime = "image/*", fg = "{{colors.tertiary.default.hex}}" },
  { mime = "{audio,video}/*", fg = "{{colors.secondary.default.hex}}" },
  { mime = "application/*zip*", fg = "{{colors.error.default.hex}}" },
  { mime = "application/*tar*", fg = "{{colors.error.default.hex}}" },
  { mime = "application/*gz*", fg = "{{colors.error.default.hex}}" },
  { url = "*", is = "orphan", fg = "{{colors.error.default.hex}}" },
  { url = "*/", fg = "{{colors.primary.default.hex}}" },
]
